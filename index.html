<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow">
<title>HAMAMATSU PHOENIX BASKETBALL CLUB</title>
<link rel="manifest" href="/phoenix-website/manifest.json">
<meta name="theme-color" content="#F9D65C">
<style>
  body {
    font-family: Arial, sans-serif;
    margin: 0;
    background: #000;
    color: #fff;
    text-align: center;
  }
  header {
    padding: 20px;
    background: #111;
  }
  .logo {
    width: 90%;
    max-width: 380px;
  }
  .main-visual {
    padding: 40px 20px;
  }
  .slogan {
    font-size: 1.4rem;
    margin: 15px 0;
    line-height: 1.6;
  }
  .btn {
    display: inline-block;
    margin-top: 20px;
    padding: 14px 28px;
    font-size: 1.1rem;
    background: #e50914;
    color: #fff;
    border-radius: 8px;
    text-decoration: none;
  }
  footer {
    margin-top: 40px;
    padding: 10px;
    font-size: 0.8rem;
    color: #aaa;
  }

  /* ===== テーマソングエリア ===== */
  .tsb-wrapper {
    display: inline-block;
    margin-top: 32px;
    max-width: 90%;
  }

  .tsb-eyebrow {
    font-size: 0.68rem;
    letter-spacing: 0.22em;
    color: rgba(249,214,92,0.55);
    text-transform: uppercase;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  .tsb-eyebrow::before,
  .tsb-eyebrow::after {
    content: '';
    display: block;
    width: 40px;
    height: 1px;
    background: rgba(249,214,92,0.25);
  }

  #theme-song-btn {
    display: inline-flex;
    align-items: center;
    gap: 16px;
    padding: 18px 26px;
    background: linear-gradient(135deg, #0d0d0d 0%, #1a1300 50%, #0d0d0d 100%);
    border: 1px solid rgba(249,214,92,0.45);
    border-radius: 14px;
    box-shadow:
      0 0 0 1px rgba(249,214,92,0.05) inset,
      0 4px 32px rgba(0,0,0,0.6),
      0 0 20px rgba(249,214,92,0.1);
    max-width: 100%;
    text-decoration: none;
    color: #fff;
    cursor: pointer;
    transition: box-shadow 0.3s, border-color 0.3s, transform 0.2s;
    overflow: hidden;
    position: relative;
  }

  /* 光沢スキャン */
  #theme-song-btn::before {
    content: '';
    position: absolute;
    top: -50%;
    left: -60%;
    width: 40%;
    height: 200%;
    background: linear-gradient(105deg, transparent 30%, rgba(249,214,92,0.13) 50%, transparent 70%);
    transform: skewX(-15deg);
    transition: left 0.65s ease;
    pointer-events: none;
  }
  #theme-song-btn:hover::before { left: 130%; }

  #theme-song-btn:hover {
    border-color: rgba(249,214,92,0.85);
    box-shadow:
      0 0 0 1px rgba(249,214,92,0.08) inset,
      0 0 30px rgba(249,214,92,0.28),
      0 0 60px rgba(249,214,92,0.08),
      0 8px 40px rgba(0,0,0,0.7);
    transform: translateY(-3px);
  }

  /* 丸アイコン */
  #tsb-icon {
    flex-shrink: 0;
    width: 46px;
    height: 46px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(249,214,92,0.22) 0%, rgba(249,214,92,0.04) 100%);
    border: 1px solid rgba(249,214,92,0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    animation: tsb-pulse 2.5s ease-in-out infinite;
  }
  @keyframes tsb-pulse {
    0%,100% { box-shadow: 0 0 10px rgba(249,214,92,0.25); }
    50%      { box-shadow: 0 0 22px rgba(249,214,92,0.6); }
  }

  /* ラベル */
  #tsb-label {
    display: flex;
    flex-direction: column;
    text-align: left;
    gap: 3px;
  }
  #tsb-title {
    font-size: 15px;
    font-weight: bold;
    color: #F9D65C;
    text-shadow: 0 0 8px rgba(249,214,92,0.5);
    white-space: nowrap;
    letter-spacing: 0.06em;
  }
  #tsb-sub {
    font-size: 10px;
    color: rgba(255,255,255,0.4);
    letter-spacing: 0.08em;
  }

  /* 矢印 */
  #tsb-arrow {
    flex-shrink: 0;
    width: 30px;
    height: 30px;
    border: 1px solid rgba(249,214,92,0.4);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    color: #F9D65C;
    transition: transform 0.2s, background 0.2s;
  }
  #theme-song-btn:hover #tsb-arrow {
    background: rgba(249,214,92,0.15);
    transform: translateX(3px);
  }

  /* スマホ */
  @media (max-width: 480px) {
    #theme-song-btn { padding: 16px 18px; gap: 12px; }
  }
</style>
</head>
<body>
  <header>
    <img src="member.png" alt="Team Logo" class="logo" />
  </header>

  <section class="main-visual">
    <h1>HAMAMATSU PHOENIX<br>BASKETBALL CLUB</h1>
    <p>2025 HISTORY ALBUM</p>
    <div class="slogan">
      One Team, One Dream.<br>仲間とともに。
    </div>

    <!-- テーマソングボタン -->
    <div class="tsb-wrapper">
      <div class="tsb-eyebrow">Player Theme Songs</div>
      <a id="theme-song-btn" href="anthems.html" target="_blank" rel="noopener">
        <div id="tsb-icon">🎵</div>
        <div id="tsb-label">
          <div id="tsb-title">MY ANTHEM</div>
          <div id="tsb-sub">選手それぞれのテーマソングを聴く</div>
        </div>
        <div id="tsb-arrow">→</div>
      </a>
    </div>

    <br>
    <a class="btn" href="videos.html">思い出の動画を見る ▶</a>
  </section>

  <footer>
    © 2025 HAMAMATSU PHOENIX BASKETBALL CLUB
  </footer>

  <script>
    // Service Worker
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/phoenix-website/sw.js')
        .then(() => console.log('Service Worker登録成功'))
        .catch(err => console.log('Service Worker登録失敗', err));
    }
  </script>
</body>
</html>
